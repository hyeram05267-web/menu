<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰 화면에 딱 맞게 보여주는 설정이에요. 지우지 마세요. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✏️ 인터넷 창 맨 위(탭)에 보이는 이름이에요. 가게 이름으로 바꿔 주세요. -->
  <title>브릿지 커피 메뉴판</title>

  <script>
    /* ###################################################################
       ✏️✏️✏️  메뉴 바꾸는 곳 (메뉴 정보는 전부 여기에만 있어요)  ✏️✏️✏️
       ###################################################################

       메뉴 이름, 가격, 설명은 이 칸 한곳에만 적혀 있어요.
       여기만 고치면 화면의 메뉴판이 저절로 바뀌어요.
       이 칸 말고 다른 곳은 고치지 않아도 돼요.

       ──────────────────────────────────────────────
       📖 생김새 이해하기
       ──────────────────────────────────────────────
       메뉴판은 '종류 상자' 안에 '메뉴 묶음'이 들어 있는 모양이에요.

         { 종류: "커피", 메뉴: [            ← 종류 상자의 시작
             { 이름: "...", 가격: 0000, 설명: "..." },   ← 메뉴 1개
             { 이름: "...", 가격: 0000, 설명: "..." },   ← 메뉴 1개
         ]},                                ← 종류 상자의 끝

       - 이름: 메뉴 이름이에요. 반드시 큰따옴표(" ") 안에 써요.
       - 가격: 숫자만 써요. 쉼표(,)와 '원'은 쓰지 않아요.
               예) 4,500원 → 4500
               쉼표와 '원'은 화면에 나올 때 저절로 붙어요.
       - 설명: 한 줄 설명이에요. 반드시 큰따옴표(" ") 안에 써요.

       ──────────────────────────────────────────────
       💰 가격 고치기
       ──────────────────────────────────────────────
       고치고 싶은 메뉴의 '가격:' 뒤 숫자만 바꾸세요.
         예) 아메리카노를 4,800원으로 올리기
             가격: 4500   →   가격: 4800

       ──────────────────────────────────────────────
       ➕ 메뉴 추가하기
       ──────────────────────────────────────────────
       1) 넣고 싶은 종류(커피/논커피/디저트) 상자를 찾아요.
       2) 그 안의 메뉴 한 줄을 통째로 복사해요.
          { 로 시작해서 }, 로 끝나는 한 줄이에요.
       3) 바로 아랫줄에 붙여 넣고 이름, 가격, 설명을 바꿔요.
          예) 커피에 '카푸치노'를 넣으려면 커피 상자 안에 아래 줄을 추가해요.
              { 이름: "카푸치노", 가격: 5000, 설명: "풍성한 우유 거품" },
       ※ 줄 끝의 쉼표(,)를 꼭 남겨 두세요. 쉼표는 메뉴와 메뉴를 나누는 표시예요.

       ──────────────────────────────────────────────
       ➖ 메뉴 빼기
       ──────────────────────────────────────────────
       빼고 싶은 메뉴의 한 줄({ 부터 }, 까지)을 통째로 지우면 돼요.

       ──────────────────────────────────────────────
       🗂️ 종류 새로 만들기 (예: '시즌 한정')
       ──────────────────────────────────────────────
       맨 아래 '디저트' 상자를 통째로 복사해서 바로 아래에 붙여 넣어요.
       { 종류: "디저트", 부터 ]}, 까지가 한 상자예요.
       그다음 종류 이름과 안의 메뉴를 바꾸면 돼요.
       화면 위쪽 버튼도 저절로 하나 더 생겨요.

       ──────────────────────────────────────────────
       ⭐ 시그니처 표시 켜고 끄기 (한 글자만 바꾸면 돼요)
       ──────────────────────────────────────────────
       메뉴 줄 끝에 있는  시그니처: "X"  가 스위치예요.
         - "O" (영어 대문자 오)  →  '시그니처' 배지가 달리고 카드가 강조돼요
         - "X" (영어 대문자 엑스) →  보통 메뉴로 보여요
         예) 카페라떼를 시그니처로 만들기
             시그니처: "X"   →   시그니처: "O"

       ──────────────────────────────────────────────
       🚫 오늘 품절 켜고 끄기 (한 글자만 바꾸면 돼요)
       ──────────────────────────────────────────────
       메뉴 줄 맨 끝에 있는  품절: "X"  가 스위치예요.
         - "O"  →  메뉴가 흐리게 보이고 '오늘 품절' 표시가 떠요
         - "X"  →  다시 정상 판매로 보여요
         예) 스콘이 다 팔렸을 때
             { 이름: "스콘", ... 품절: "X" },   →   { 이름: "스콘", ... 품절: "O" },
         내일 다시 팔 때는 "O"를 "X"로 되돌리면 돼요.
       ※ 따옴표(" ")는 지우지 말고, 따옴표 안의 글자 하나만 바꾸세요.
       ※ 한글 'ㅇ'이나 소문자 'o'로 써도 켜지도록 만들어 두었어요.

       ──────────────────────────────────────────────
       ⚠️ 자주 하는 실수 (화면에 메뉴가 안 나오면 여기를 확인!)
       ──────────────────────────────────────────────
       - 큰따옴표(")를 하나 빼먹었어요.        예) 이름: "아메리카노,  ← 끝 따옴표 없음
       - 가격에 쉼표나 '원'을 넣었어요.         예) 가격: 4,500원  ← 틀림 / 가격: 4500 ← 맞음
       - 줄 끝 쉼표(,)를 지웠어요.
       - 괄호 { } [ ] 를 지웠거나 하나 더 넣었어요.
       고친 뒤에는 꼭 '저장'하고, 인터넷 창에서 '새로 고침'을 눌러 확인하세요.
       잘 안 되면 고치기 전 파일로 되돌리면 돼요.
       ################################################################### */

    const 메뉴판정보 = [

      // ===== 커피 =====
      { 종류: "커피", 메뉴: [
        { 이름: "아메리카노",           가격: 4500, 설명: "산미가 적은 고소한 원두",           시그니처: "X", 품절: "X" },
        { 이름: "카페라떼",             가격: 5000, 설명: "부드러운 우유 거품",                시그니처: "X", 품절: "X" },
        { 이름: "바닐라 라떼",          가격: 5500, 설명: "바닐라빈을 직접 우려낸 시럽",       시그니처: "X", 품절: "X" },
        { 이름: "아인슈페너",           가격: 5800, 설명: "단맛을 줄인 수제 크림",             시그니처: "O", 품절: "X" },
        { 이름: "콜드브루",             가격: 5300, 설명: "12시간 저온 추출, 목넘김이 깔끔함", 시그니처: "X", 품절: "X" },
        { 이름: "디카페인 아메리카노",  가격: 5000, 설명: "카페인 걱정 없이 편하게",           시그니처: "X", 품절: "X" },
      ]},

      // ===== 논커피 =====
      { 종류: "논커피", 메뉴: [
        { 이름: "흑임자 라떼",  가격: 5500, 설명: "국산 흑임자를 직접 갈아 넣음", 시그니처: "O", 품절: "X" },
        { 이름: "말차 라떼",    가격: 5800, 설명: "우지 말차, 쌉쌀한 맛이 진함",  시그니처: "X", 품절: "X" },
        { 이름: "쑥 라떼",      가격: 5500, 설명: "강화도 쑥, 은은하고 담백함",   시그니처: "X", 품절: "X" },
        { 이름: "곡물 라떼",    가격: 5300, 설명: "볶은 곡물의 구수한 맛",        시그니처: "X", 품절: "X" },
        { 이름: "자몽에이드",   가격: 6000, 설명: "생과일 자몽 과육을 그대로",    시그니처: "X", 품절: "X" },
      ]},

      // ===== 디저트 =====
      { 종류: "디저트", 메뉴: [
        { 이름: "치즈케이크",         가격: 6500, 설명: "굽지 않은 부드러운 식감",        시그니처: "X", 품절: "X" },
        { 이름: "당근케이크",         가격: 6000, 설명: "견과류를 넉넉히 넣음",           시그니처: "X", 품절: "X" },
        { 이름: "스콘",               가격: 4000, 설명: "겉은 바삭 속은 촉촉, 잼과 함께", 시그니처: "X", 품절: "X" },
        { 이름: "바스크 치즈케이크",  가격: 6800, 설명: "겉면을 진하게 태운 풍미",        시그니처: "X", 품절: "X" },
      ]},

    ];
    /* ######## ✏️ 메뉴 바꾸는 곳 끝 (이 아래로는 고치지 않아도 돼요) ######## */
  </script>

  <!-- '고운 돋움' 글꼴을 불러오는 줄이에요. 지우지 마세요. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ✏️ 색깔 바꾸는 곳
       아래 #으로 시작하는 글자가 색깔 번호예요.
       번호만 바꾸면 메뉴판 전체 색이 한꺼번에 바뀌어요.
       (배경 수채화 그림의 색은 아래 '배경 수채화 그림' 부분에 따로 있어요)
       ========================================================= */
    :root {
      --연두: #9CCB5F;          /* 대표색 1: 연두색 (꼬리표, 테두리) */
      --연두연한: #E6F3D3;      /* 연두색을 아주 옅게 (아이콘 바탕) */
      --주황: #F08A35;          /* 대표색 2: 주황색 (선택된 버튼) */
      --주황진한: #D2601A;      /* 가격 글자색 (눈에 잘 띄게 진한 주황) */
      --주황연한: #FDE6D2;      /* 주황색을 아주 옅게 (아이콘 바탕) */
      --글자: #3B4630;          /* 기본 글자색 (짙은 올리브) */
      --바탕: #FBF8F1;          /* 화면 바탕색 (수채화 종이 색) */
      --카드: rgba(255, 255, 255, 0.9);  /* 카드 색 (살짝 비치는 흰색) */
      --그림자: 0 10px 30px rgba(70, 90, 40, 0.12), 0 2px 6px rgba(70, 90, 40, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* 글꼴: 고운 돋움이 먼저, 없으면 맑은 고딕을 써요 */
      font-family: 'Gowun Dodum', 'Malgun Gothic', '맑은 고딕', sans-serif;
      font-size: 16px;
      color: var(--글자);
      background-color: var(--바탕);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ---------- 배경 수채화 그림 ----------
       화면 뒤에 고정된 수채화 정원 그림이에요. */
    .배경그림 {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .배경그림 svg { width: 100%; height: 100%; }

    /* 화면 가운데에 놓이는 상자 (휴대폰 폭 390px 기준) */
    .메뉴판 {
      position: relative;
      z-index: 1;
      max-width: 390px;
      margin: 0 auto;
      padding: 36px 22px 56px;
    }

    /* 카드 공통 모양: 둥근 모서리 + 부드러운 그림자 */
    .카드 {
      background: var(--카드);
      border-radius: 26px;
      box-shadow: var(--그림자);
    }

    /* ---------- 1. 맨 위: 가게 이름 ---------- */
    .머리 {
      text-align: center;
      padding: 30px 24px 30px;
      margin-bottom: 26px;
    }
    .머리 .그림 {
      width: 104px;
      height: 104px;
      margin: 0 auto 12px;
      display: block;
    }
    .머리 .가게이름 {
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .머리 .소개 {
      display: inline-block;
      font-size: 16px;
      padding: 6px 18px;
      background: var(--연두연한);
      border-radius: 999px;
    }

    /* ---------- 카테고리 버튼 줄 ----------
       화면을 아래로 내려도 버튼 줄은 화면 맨 위에 붙어 있어요. */
    .종류버튼줄 {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 10px;
      margin: 0 -22px 30px;      /* 화면 끝까지 바탕이 닿도록 */
      padding: 14px 22px 16px;
      background: rgba(251, 248, 241, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow-x: auto;          /* 버튼이 많아지면 옆으로 밀어서 볼 수 있어요 */
      scrollbar-width: none;
    }
    .종류버튼줄::-webkit-scrollbar { display: none; }

    .종류버튼 {
      flex: 1 0 auto;
      min-height: 52px;          /* ✏️ 버튼 높이: 손가락으로 누르기 편한 크기예요 */
      padding: 0 16px;
      font-family: inherit;
      font-size: 17px;           /* ✏️ 버튼 글자 크기 */
      color: var(--글자);
      background: #FFFFFF;
      border: 2px solid var(--연두연한);
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(70, 90, 40, 0.08);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }
    /* 지금 선택된 버튼: 주황 바탕 + 흰 글자 */
    .종류버튼.선택됨 {
      background: var(--주황);
      border-color: var(--주황);
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(240, 138, 53, 0.35);
    }
    .종류버튼:active { transform: scale(0.96); }

    /* 숨겨진 종류 묶음 */
    .종류묶음[hidden] { display: none; }
    .종류묶음 + .종류묶음 { margin-top: 12px; }

    /* ---------- 2. 가운데: 메뉴 목록 ---------- */
    .제목줄 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      margin: 0 4px 18px;
    }
    /* 종류 이름(커피/논커피/디저트)을 감싸는 꼬리표 */
    .제목줄 .종류표 {
      padding: 3px 18px;
      border-radius: 999px;
    }
    /* 종류 이름 옆의 붓으로 그은 듯한 선 */
    .제목줄 .붓선 {
      flex: 1;
      height: 6px;
      border-radius: 6px;
      opacity: 0.55;
    }

    .메뉴목록 {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }
    .메뉴 {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 20px;
    }
    /* 메뉴 왼쪽의 동그라미 아이콘 */
    .메뉴 .아이콘 {
      flex: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .메뉴 .아이콘 svg { width: 26px; height: 26px; }
    .메뉴 .내용 { flex: 1; min-width: 0; }
    .메뉴 .윗줄 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    .메뉴 .이름 { font-size: 19px; word-break: keep-all; }  /* 긴 이름은 낱말 단위로 줄 바꿈 */
    /* ✏️ 가격 글자: 크기(font-size)와 진하기(font-weight)를 여기서 바꿔요 */
    .메뉴 .가격 {
      font-size: 20px;
      font-weight: 700;
      color: var(--주황진한);
      white-space: nowrap;
    }
    .메뉴 .설명 {
      font-size: 15px;
      opacity: 0.72;
      margin-top: 4px;
    }

    /* ---------- 시그니처 / 품절 표시 ---------- */
    /* 메뉴 이름 위에 붙는 작은 배지 줄 */
    .메뉴 .배지줄 {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .배지 {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 999px;
    }
    /* ✏️ 시그니처 배지 글자는 아래 '시그니처배지글자'에서 바꿀 수 있어요 */
    .배지.시그니처배지 {
      background: var(--주황);
      color: #FFFFFF;
    }
    .배지.품절배지 {
      background: #5A5F55;
      color: #FFFFFF;
    }

    /* 시그니처 카드: 주황 테두리 + 따뜻한 바탕 + 조금 더 진한 그림자 */
    .메뉴.시그니처 {
      background: linear-gradient(135deg, #FFF7EE 0%, #FFFFFF 70%);
      box-shadow: 0 0 0 2px var(--주황), 0 14px 32px rgba(240, 138, 53, 0.22);
    }
    .메뉴.시그니처 .이름 { font-weight: 700; }

    /* 품절 카드: 흐리게 + 색 빼기 + 가격에 줄 긋기 */
    .메뉴.품절 {
      background: rgba(245, 245, 242, 0.85);
      box-shadow: none;
    }
    .메뉴.품절 .아이콘,
    .메뉴.품절 .이름,
    .메뉴.품절 .가격,
    .메뉴.품절 .설명,
    .메뉴.품절 .시그니처배지 {
      opacity: 0.45;
      filter: grayscale(1);
    }
    .메뉴.품절 .가격 { text-decoration: line-through; }

    /* ---------- 3. 맨 아래: 영업시간과 전화 버튼 ---------- */
    .아래 {
      padding: 28px 24px;
      text-align: center;
    }
    .아래 .작은제목 {
      display: inline-block;
      font-size: 15px;
      padding: 3px 16px;
      margin-bottom: 12px;
      background: var(--연두연한);
      border-radius: 999px;
    }
    .아래 .영업시간 {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .전화버튼 {
      display: block;
      min-height: 56px;
      line-height: 56px;
      border-radius: 18px;
      background: var(--주황);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(240, 138, 53, 0.35);
    }
    .전화버튼:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <!-- ===================== 배경 수채화 그림 =====================
       물감이 번진 듯한 정원 그림이에요. 메뉴판 내용과는 상관없어요.
       ✏️ fill="#..." 의 색 번호를 바꾸면 배경 그림 색이 바뀌어요. -->
  <div class="배경그림" aria-hidden="true">
    <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- 물감 번짐 효과 -->
        <filter id="물감번짐" x="-50%" y="-50%" width="200%" height="200%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="결"/>
          <feDisplacementMap in="SourceGraphic" in2="결" scale="38" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="5"/>
        </filter>
        <!-- 잉크 선 번짐 효과 -->
        <filter id="잉크번짐" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="2" result="결"/>
          <feDisplacementMap in="SourceGraphic" in2="결" scale="4"/>
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
        <!-- 종이 질감 -->
        <filter id="종이결">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
          <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0.08 0"/>
        </filter>
      </defs>

      <!-- 물감 얼룩 (투명하게 겹친 층) -->
      <g filter="url(#물감번짐)">
        <!-- 위쪽 왼편 잎사귀 덤불 -->
        <ellipse cx="20"  cy="40"  rx="110" ry="80" fill="#B9DD86" opacity="0.45"/>
        <ellipse cx="70"  cy="10"  rx="70"  ry="50" fill="#8FC45A" opacity="0.35"/>
        <!-- 위쪽 오른편 주황 꽃 -->
        <circle  cx="350" cy="90"  r="58" fill="#FFB877" opacity="0.45"/>
        <circle  cx="380" cy="40"  r="40" fill="#F6904A" opacity="0.3"/>
        <!-- 가운데 양옆 -->
        <ellipse cx="-10" cy="380" rx="70" ry="110" fill="#C8E59C" opacity="0.45"/>
        <circle  cx="400" cy="460" r="70" fill="#FFD3A6" opacity="0.45"/>
        <circle  cx="20"  cy="560" r="36" fill="#FFB877" opacity="0.35"/>
        <!-- 아래쪽 풀밭 -->
        <ellipse cx="80"  cy="840" rx="170" ry="90" fill="#A9D46F" opacity="0.45"/>
        <ellipse cx="330" cy="860" rx="150" ry="90" fill="#C8E59C" opacity="0.5"/>
        <circle  cx="300" cy="760" r="40" fill="#FFB877" opacity="0.4"/>
        <circle  cx="160" cy="790" r="26" fill="#FFE1A0" opacity="0.45"/>
      </g>

      <!-- 잉크 선으로 그린 줄기와 잎 -->
      <g filter="url(#잉크번짐)" fill="none" stroke="#6E9A3E" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
        <path d="M40 140 q20 -50 70 -80"/>
        <path d="M70 100 q-25 -5 -30 -30 q25 5 30 30 z" fill="#B9DD86" fill-opacity="0.5"/>
        <path d="M92 76 q5 -25 30 -30 q-5 25 -30 30 z" fill="#9CCB5F" fill-opacity="0.5"/>
        <path d="M330 830 q-10 -70 30 -120"/>
        <path d="M340 760 q-25 -15 -20 -40 q20 15 20 40 z" fill="#B9DD86" fill-opacity="0.5"/>
        <path d="M352 730 q20 -20 40 -10 q-20 20 -40 10 z" fill="#9CCB5F" fill-opacity="0.5"/>
        <path d="M20 800 q10 -40 -5 -70"/>
      </g>
      <!-- 잉크 선으로 그린 주황 꽃 -->
      <g filter="url(#잉크번짐)" stroke="#D2601A" stroke-width="1.4" fill="#F6904A" fill-opacity="0.35" opacity="0.7">
        <g transform="translate(345 92)">
          <ellipse rx="7" ry="14" cy="-12"/><ellipse rx="7" ry="14" cy="-12" transform="rotate(72)"/>
          <ellipse rx="7" ry="14" cy="-12" transform="rotate(144)"/><ellipse rx="7" ry="14" cy="-12" transform="rotate(216)"/>
          <ellipse rx="7" ry="14" cy="-12" transform="rotate(288)"/><circle r="5" fill="#FFE1A0" fill-opacity="1"/>
        </g>
        <g transform="translate(300 762) scale(0.75)">
          <ellipse rx="7" ry="14" cy="-12"/><ellipse rx="7" ry="14" cy="-12" transform="rotate(72)"/>
          <ellipse rx="7" ry="14" cy="-12" transform="rotate(144)"/><ellipse rx="7" ry="14" cy="-12" transform="rotate(216)"/>
          <ellipse rx="7" ry="14" cy="-12" transform="rotate(288)"/><circle r="5" fill="#FFE1A0" fill-opacity="1"/>
        </g>
      </g>

      <!-- 수채화 종이 질감 -->
      <rect width="390" height="844" filter="url(#종이결)"/>
    </svg>
  </div>

  <main class="메뉴판">

    <!-- ===================== 1. 맨 위 ===================== -->
    <header class="머리 카드">
      <!-- 수채화 느낌의 커피잔 그림 (그림만 있는 부분이라 고치지 않아도 돼요) -->
      <svg class="그림" viewBox="0 0 104 104" aria-hidden="true">
        <defs>
          <filter id="컵번짐" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="5" result="결"/>
            <feDisplacementMap in="SourceGraphic" in2="결" scale="5"/>
            <feGaussianBlur stdDeviation="0.8"/>
          </filter>
        </defs>
        <g filter="url(#컵번짐)">
          <circle cx="52" cy="56" r="42" fill="#E6F3D3"/>
          <ellipse cx="52" cy="86" rx="34" ry="7" fill="#9CCB5F" opacity="0.7"/>
          <path d="M26 50 h48 v16 a18 18 0 0 1 -18 18 h-12 a18 18 0 0 1 -18 -18 z" fill="#F6904A" opacity="0.85"/>
          <path d="M74 56 h6 a9 9 0 0 1 0 18 h-6" fill="none" stroke="#F6904A" stroke-width="4" opacity="0.85"/>
          <ellipse cx="50" cy="50" rx="24" ry="4" fill="#B5703A" opacity="0.6"/>
        </g>
        <g fill="none" stroke="#6E9A3E" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
          <path d="M42 22 q-5 7 0 14"/>
          <path d="M54 16 q-5 8 0 18"/>
        </g>
      </svg>

      <!-- ✏️ 가게 이름을 바꾸려면 아래 글자를 고치세요 -->
      <h1 class="가게이름">브릿지 커피</h1>
      <!-- ✏️ 한 줄 소개를 바꾸려면 아래 글자를 고치세요 -->
      <p class="소개">매일 직접 볶는 스페셜티 커피</p>
    </header>

    <!-- ===================== 2. 가운데: 메뉴 ===================== -->
    <!-- 카테고리 버튼(전체/커피/논커피/디저트)이 들어가는 칸이에요.
         버튼은 파일 맨 위 '메뉴 바꾸는 곳'의 종류를 보고 저절로 만들어져요.
         새 종류를 추가하면 버튼도 저절로 하나 더 생겨요. 이 칸은 비워 두세요. -->
    <nav class="종류버튼줄" id="종류버튼들" aria-label="메뉴 종류 고르기"></nav>

    <!-- 메뉴는 파일 맨 위 '메뉴 바꾸는 곳'의 내용으로 자동으로 채워져요.
         이 칸은 비워 두세요. 메뉴를 고칠 때는 파일 맨 위로 가세요. -->
    <div id="메뉴목록"></div>

    <!-- ===================== 3. 맨 아래 ===================== -->
    <footer class="아래 카드">
      <p class="작은제목">영업시간</p>
      <!-- ✏️ 영업시간을 바꾸려면 아래 글자를 고치세요.
           <br>은 '줄 바꿈'이라는 뜻이에요. -->
      <p class="영업시간">
        평일 08:00 - 21:00<br>
        주말 10:00 - 20:00<br>
        목요일 휴무
      </p>

      <!-- ✏️ 전화번호를 바꿀 때는 두 군데를 모두 고치세요.
           1) tel: 뒤의 번호 (빼기 표시 없이 숫자만)
           2) 버튼에 보이는 번호 -->
      <a class="전화버튼" href="tel:0620000000">📞 전화 걸기 (062-000-0000)</a>
    </footer>

  </main>

  <script>
    /* ---------- 여기는 고치지 않아도 돼요 ----------
       파일 맨 위 '메뉴 바꾸는 곳'의 내용을 읽어서
       종류별 제목과 메뉴 카드를 화면에 그려 주는 부분이에요.
       메뉴를 고치려면 파일 맨 위로 가세요. */

    // 종류마다 [꼬리표 색, 아이콘 바탕색]이 연두 → 주황 → 연노랑 순서로 정해져요
    const 종류색 = [
      { 진한: "#C8E59C", 연한: "var(--연두연한)" },
      { 진한: "#FFCB98", 연한: "var(--주황연한)" },
      { 진한: "#FFE1A0", 연한: "#FFF3D6" }
    ];

    // 종류별 작은 그림 (커피콩 / 컵 / 케이크)
    const 선색 = "#3B4630";
    const 그림모음 = {
      "커피":
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<ellipse cx="12" cy="12" rx="7" ry="9.5" transform="rotate(30 12 12)" fill="#B5703A" fill-opacity="0.75"/>' +
          '<path d="M8 6 q6 6 0 12" transform="rotate(30 12 12)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>' +
        '</svg>',
      "논커피":
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M14 2 l-2 5" stroke="' + 선색 + '" stroke-width="1.8" stroke-linecap="round"/>' +
          '<path d="M6 7 h12 l-1.5 14 h-9 z" fill="#FFFFFF" stroke="' + 선색 + '" stroke-width="1.8" stroke-linejoin="round"/>' +
          '<path d="M6.6 12 h10.8 l-1 9 h-8.8 z" fill="#9CCB5F" fill-opacity="0.7"/>' +
        '</svg>',
      "디저트":
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M3 19 v-7 l18 -6 v13 z" fill="#FFF8EC" stroke="' + 선색 + '" stroke-width="1.8" stroke-linejoin="round"/>' +
          '<path d="M3 14 l18 -4" stroke="#F08A35" stroke-width="2"/>' +
          '<circle cx="17" cy="4" r="2.2" fill="#F08A35"/>' +
        '</svg>'
    };

    // 배지에 보이는 글자 (✏️ 바꾸고 싶으면 따옴표 안 글자만 고치세요)
    const 시그니처배지글자 = "★ 시그니처";
    const 품절배지글자 = "오늘 품절";

    // 스위치가 켜졌는지 알아보는 도우미: "O", "o", "ㅇ" 모두 '켜짐'으로 봐요
    function 켜짐(값) {
      return ["O", "o", "ㅇ", "Ｏ"].indexOf(String(값 || "").trim()) !== -1;
    }

    const 목록칸 = document.getElementById("메뉴목록");

    메뉴판정보.forEach(function (묶음, 종류순서) {
      const 색 = 종류색[종류순서 % 종류색.length];
      // 새로 만든 종류는 커피콩 그림을 써요
      const 그림 = 그림모음[묶음.종류] || 그림모음["커피"];

      // 종류 제목 (예: 커피 ─────)
      const 제목 = document.createElement("h2");
      제목.className = "제목줄";
      제목.innerHTML = '<span class="종류표"></span><span class="붓선"></span>';
      제목.querySelector(".종류표").textContent = 묶음.종류;
      제목.querySelector(".종류표").style.background = 색.진한;
      제목.querySelector(".붓선").style.background =
        "linear-gradient(90deg, " + 색.진한 + ", transparent)";

      // 제목과 메뉴 카드를 한 상자(종류묶음)에 담아요. 버튼으로 이 상자를 보였다 숨겼다 해요.
      const 묶음칸 = document.createElement("div");
      묶음칸.className = "종류묶음";
      묶음칸.dataset.종류 = 묶음.종류;
      묶음칸.appendChild(제목);

      // 그 종류의 메뉴 카드들
      const 칸 = document.createElement("section");
      칸.className = "메뉴목록";
      묶음.메뉴.forEach(function (메뉴) {
        const 카드 = document.createElement("article");
        카드.className = "메뉴 카드";
        카드.innerHTML =
          '<div class="아이콘">' + 그림 + '</div>' +
          '<div class="내용">' +
            '<div class="윗줄">' +
              '<span class="이름"></span>' +
              '<span class="가격"></span>' +
            '</div>' +
            '<p class="설명"></p>' +
          '</div>';
        카드.querySelector(".아이콘").style.background = 색.연한;
        카드.querySelector(".이름").textContent = 메뉴.이름;
        카드.querySelector(".가격").textContent = Number(메뉴.가격).toLocaleString("ko-KR") + "원";
        카드.querySelector(".설명").textContent = 메뉴.설명;

        // 시그니처 / 품절 표시 붙이기
        const 시그니처임 = 켜짐(메뉴.시그니처);
        const 품절임 = 켜짐(메뉴.품절);
        if (시그니처임 || 품절임) {
          const 배지줄 = document.createElement("div");
          배지줄.className = "배지줄";
          if (시그니처임) {
            카드.classList.add("시그니처");
            const 배지 = document.createElement("span");
            배지.className = "배지 시그니처배지";
            배지.textContent = 시그니처배지글자;
            배지줄.appendChild(배지);
          }
          if (품절임) {
            카드.classList.add("품절");
            const 배지 = document.createElement("span");
            배지.className = "배지 품절배지";
            배지.textContent = 품절배지글자;
            배지줄.appendChild(배지);
          }
          카드.querySelector(".내용").prepend(배지줄);
        }
        칸.appendChild(카드);
      });
      묶음칸.appendChild(칸);
      목록칸.appendChild(묶음칸);
    });

    /* ---------- 카테고리 버튼 만들기 (고치지 않아도 돼요) ----------
       '전체' 버튼 + 메뉴판정보에 있는 종류마다 버튼을 하나씩 만들어요.
       버튼을 누르면 그 종류만 보이고, '전체'를 누르면 모두 보여요. */
    const 버튼칸 = document.getElementById("종류버튼들");
    const 버튼이름들 = ["전체"].concat(메뉴판정보.map(function (묶음) { return 묶음.종류; }));

    function 종류고르기(고른종류) {
      // 1) 메뉴 묶음 보이기/숨기기
      document.querySelectorAll(".종류묶음").forEach(function (상자) {
        상자.hidden = !(고른종류 === "전체" || 상자.dataset.종류 === 고른종류);
      });
      // 2) 선택된 버튼만 색을 다르게
      버튼칸.querySelectorAll(".종류버튼").forEach(function (버튼) {
        const 선택 = 버튼.dataset.종류 === 고른종류;
        버튼.classList.toggle("선택됨", 선택);
        버튼.setAttribute("aria-pressed", 선택 ? "true" : "false");
      });
      // 3) 화면을 많이 내려와 있었다면 메뉴 맨 위로 살짝 올려 줘요
      const 목록위치 = 목록칸.getBoundingClientRect().top + window.scrollY - 버튼칸.offsetHeight;
      if (window.scrollY > 목록위치) window.scrollTo({ top: 목록위치, behavior: "smooth" });
    }

    버튼이름들.forEach(function (이름) {
      const 버튼 = document.createElement("button");
      버튼.type = "button";
      버튼.className = "종류버튼";
      버튼.dataset.종류 = 이름;
      버튼.textContent = 이름;
      버튼.addEventListener("click", function () { 종류고르기(이름); });
      버튼칸.appendChild(버튼);
    });

    // 맨 처음 들어오면 '전체'가 선택된 상태로 보여요
    종류고르기("전체");
  </script>
</body>
</html>
